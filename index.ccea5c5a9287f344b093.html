<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>Odin Weather App</title><link rel=stylesheet href=style.6691debf2515701cee8c.css></head><body>
    <main>
      <h1>Odin Weather App</h1>

      <form novalidate>
        <div class=form-fields>
          <label for=location class=field-label>Location</label>
          <input type=search name=location id=location required autofocus>

          <span class=field-label>Temperature Unit</span>
          <div class=radio-group>
            <input type=radio name=tempUnit id=celsius value=C checked>
            <label for=celsius>°C</label>

            <input type=radio name=tempUnit id=fahrenheit value=F>
            <label for=fahrenheit>°F</label>
          </div>
        </div>

        <div class=form-actions>
          <button type=submit>Submit</button>
        </div>
      </form>

      <table hidden>
        <thead>
          <tr>
            <th scope=col>Name</th>
            <th scope=col>Value</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope=row>Conditions</th>
            <td id=conditions></td>
          </tr>
          <tr>
            <th scope=row>
              Temperature
              <span class=nowrap>(<span id=temp-unit>°C</span>)</span>
            </th>
            <td id=temp></td>
          </tr>
          <tr>
            <th scope=row>
              Feels Like
              <span class=nowrap>(<span id=feels-like-unit>°C</span>)</span>
            </th>
            <td id=feels-like></td>
          </tr>
          <tr>
            <th scope=row>Humidity <span class=nowrap>(%)</span></th>
            <td id=humidity></td>
          </tr>
          <tr>
            <th scope=row>Wind Speed <span class=nowrap>(km/h)</span></th>
            <td id=wind-speed></td>
          </tr>
          <tr>
            <th scope=row>Probability of Precipitation <span>(%)</span></th>
            <td id=precip-prob></td>
          </tr>
        </tbody>
      </table>
    </main>

    <div class=loading-overlay hidden>Submitting...</div>

    <script src=index.50e78e142b17fa1f89cf.js></script>
  

</body></html>
